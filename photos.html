<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Memories ❤️</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px 12px;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    text-align: center;
    background: linear-gradient(135deg, #ff9aaf, #ffe6ef);
    color: #c2185b;
}

.container {
    max-width: 600px;
    margin: auto;
    padding: 22px 15px;
    background: white;
    border-radius: 22px;
    box-shadow: 0 8px 25px #a52a5040;
}

h1 {
    font-size: 30px;
}

.message {
    font-size: 14px;
    color: #75445a;
    line-height: 1.7;
}

.photo-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 10px;
    margin: 22px 0;
}

.scratch-card {
    position: relative;
    aspect-ratio: 1;
    overflow: hidden;
    border-radius: 12px;
    border: 2px solid #ffb6cf;
    background: #ffe0eb;
}

.scratch-card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

.scratch-card canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    touch-action: none;
}

.buttons {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 22px;
}

.btn {
    display: inline-block;
    padding: 12px 22px;
    background: linear-gradient(135deg, #ff477e, #d81b60);
    color: white;
    text-decoration: none;
    border-radius: 25px;
    font-size: 15px;
    font-weight: bold;
}

@media (max-width: 350px) {
    .photo-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>Our Beautiful Memories ❤️</h1>

    <p class="message">
        Scratch each photo and reveal our beautiful memories.
        Every little moment with you is special, Rex Appa! 💖
    </p>

    <div class="photo-grid" id="photoGrid"></div>

    <p class="message">
        I will keep choosing you, today and forever. 🫂❤️
    </p>

    <div class="buttons">
        <a href="video1.html" class="btn">🎬 Video1</a>
    
    </div>

</div>

<script>
const photos = [
    "1.jpeg",
    "2.jpeg",
    "3.jpeg",
    "4.jpeg",
    "5.jpeg",
    "6.jpeg",
    "7.jpeg",
    "8.jpeg",
    "9.jpeg"
];

const photoGrid = document.getElementById("photoGrid");

photos.forEach(function(photo) {

    const card = document.createElement("div");
    card.className = "scratch-card";

    const img = document.createElement("img");
    img.src = photo;
    img.alt = "Our memory";

    card.appendChild(img);

    const canvas = document.createElement("canvas");
    card.appendChild(canvas);
    photoGrid.appendChild(card);

    const ctx = canvas.getContext("2d");
    let drawing = false;

    function setupCanvas() {
        const rect = card.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;

        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;

        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.globalCompositeOperation = "source-over";

        ctx.fillStyle = "#f46b9a";
        ctx.fillRect(0, 0, rect.width, rect.height);

        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 13px Arial";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(
            "Scratch Me ❤️",
            rect.width / 2,
            rect.height / 2
        );
    }

    setupCanvas();

    function scratch(event) {
        if (!drawing) return;

        event.preventDefault();

        const rect = canvas.getBoundingClientRect();
        const x = event.clientX - rect.left;
        const y = event.clientY - rect.top;

        ctx.globalCompositeOperation = "destination-out";
        ctx.beginPath();
        ctx.arc(x, y, 17, 0, Math.PI * 2);
        ctx.fill();
    }

    canvas.addEventListener("pointerdown", function(event) {
        drawing = true;
        canvas.setPointerCapture(event.pointerId);
        scratch(event);
    });

    canvas.addEventListener("pointermove", scratch);

    canvas.addEventListener("pointerup", function() {
        drawing = false;
    });

    canvas.addEventListener("pointercancel", function() {
        drawing = false;
    });

});
</script>

</body>
</html>
